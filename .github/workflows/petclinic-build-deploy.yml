name: petclinic build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  JF_URL: ${{ vars.JF_URL }}
  
  
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
      JF_PROJECT: ${{ vars.JF_PROJECT }}
      JFROG_DOCKER_USERNAME: ${{ secrets.JFROG_DOCKER_USERNAME }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve project version
        id: version
        run: echo "version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"  

      - name: Install JFrog CLI
        id: jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4.9.1
        env:
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: true
          JFROG_CLI_LOG_LEVEL: DEBUG
        with:
          oidc-provider-name: github-oidc-integration
          oidc-audience: jfrog-github
      
      - name: Build and test (Maven)
        run: ./mvnw -B -ntp verify -DskipTests=true

      - name: Check condition - main branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "is_main=true"
          else
            echo "is_main=false"
          fi
          echo "github.ref=${{ github.ref }}"

      - name: Check condition - push event
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "is_push_event=true"
          else
            echo "is_push_event=false"
          fi
          echo "github.event_name=${{ github.event_name }}"

      - name: Check condition - JFROG_DOCKER_USERNAME set
        run: |
          if [ -n "${JFROG_DOCKER_USERNAME}" ]; then
            echo "jfrog_docker_username_set=true"
          else
            echo "jfrog_docker_username_set=false"
          fi

      - name: Check condition - JFrog OIDC token set
        run: |
          if [ -n "${{ steps.jfrog-cli.outputs.oidc-token }}" ]; then
            echo "jfrog_oidc_token_set=true"
          else
            echo "jfrog_oidc_token_set=false"
          fi

      - name: Build and publish image (JFrog registry)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.JFROG_DOCKER_USERNAME != '' && steps.jfrog-cli.outputs.oidc-token != '' }}
        run: |
          ./mvnw -B -ntp spring-boot:build-image \
            -Dspring-boot.build-image.imageName=tomjfrog.jfrog.io/petclinic-docker-dev-local/petclinic:${{ steps.version.outputs.version }} \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.url=tomjfrog.jfrog.io \
            -Ddocker.publishRegistry.username="${JFROG_DOCKER_USERNAME}" \
            -Ddocker.publishRegistry.password="${{ steps.jfrog-cli.outputs.oidc-token }}"