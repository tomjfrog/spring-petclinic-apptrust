name: petclinic build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  JF_URL: ${{ vars.JF_URL }}
  
  
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
      JF_PROJECT: ${{ vars.JF_PROJECT }}
      JFROG_DOCKER_USERNAME: ${{ secrets.JFROG_DOCKER_USERNAME }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve project version
        id: version
        run: echo "version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"  
      
      - name: Inject JFrog CLI
        id: jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: 2.88.0

      - name: Build and test (Maven)
        run: ./mvnw -B -ntp verify

      - name: Build and publish image (JFrog registry)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.JFROG_DOCKER_USERNAME != '' && env.JFROG_DOCKER_PASSWORD != '' }}
        run: |
          ./mvnw -B -ntp spring-boot:build-image \
            -Dspring-boot.build-image.imageName=tomjfrog.jfrog.io/petclinic-docker-dev-local/petclinic:${{ steps.version.outputs.version }} \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.url=tomjfrog.jfrog.io \
            -Ddocker.publishRegistry.username="${{ secrets.JFROG_DOCKER_USERNAME }}" \
            -Ddocker.publishRegistry.password="${{ steps.jfrog-cli.outputs.oidc-token }}"